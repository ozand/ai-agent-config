name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate rendered templates are current
        run: python scripts/check_rendered.py

      - name: Validate policy and secret hygiene
        run: python scripts/validate.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
