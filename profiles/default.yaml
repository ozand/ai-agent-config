schema_version: 1
name: default
endpoint: litellm-edge
interactive_model: litellm-edge/cl/gpt-6-luna
small_model: litellm-edge/an/gemini-3.8-flash-low
pi_thinking_level: low
policy: catalog/model-policy.yaml
agent_routing: catalog/agent-routing.yaml
compaction:
  pi_strategy: native
  pi_reserve_tokens: 16384
  pi_keep_recent_tokens: 20000
  pi_note: >
    Pi's built-in compaction is enabled with the configured reserve and recent-token
    retention values. No repository-managed fixed-threshold auto-compaction extension
    is installed; the client handles compaction according to its native behavior.
  opencode_strategy: model_specific_dcp
  opencode_note: >
    OpenCode uses agent-specific DCP (Dynamic Context Pruning) ranges that vary by
    model capability. This remains an OpenCode-specific strategy, separate from Pi's
    native compaction behavior.
notes:
  - Role-specific agent routing remains authoritative over the interactive default.
  - Pi uses native compaction; no repository-managed fixed-threshold extension is included.
  - OpenCode DCP is model-specific and independent of Pi's native compaction.
